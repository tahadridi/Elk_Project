input {
  file {
    path => "/data/input/*.txt"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_txt"
  }
}

filter {
  grok {
    match => { "path" => "/data/input/(?<file_id>[^_/]+)_" }
    tag_on_failure => []
  }

  mutate {
    add_field => {
      "timestamp" => "%{@timestamp}"
      "level" => "INFO"
      "service" => "txt-log"
      "event_action" => "log"
      "event_outcome" => "success"
      "[@metadata][source_type]" => "txt"
    }
  }
}

output { pipeline { send_to => ["normalize"] } }
