input {
  file {
    path => "/data/input/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
  }
}
filter {
  csv {
    columns => ["timestamp","level","service","event_action","event_outcome","source_ip","user_name","message"]
    skip_header => true
  }
  if ![timestamp] or ![level] or ![source_ip] {
    mutate { add_tag => ["_csvparsefailure"] }
  }
  grok {
    match => { "path" => "/data/input/(?<file_id>[^_/]+)_" }
    tag_on_failure => []
  }
  mutate { add_field => { "[@metadata][source_type]" => "csv" } }
}
output { pipeline { send_to => ["normalize"] } }
