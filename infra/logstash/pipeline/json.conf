input {
  file {
    path => "/data/input/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_json"
  }
}
filter {
  json {
    source => "message"
    tag_on_failure => ["_jsonparsefailure"]
  }
  grok {
    match => { "path" => "/data/input/(?<file_id>[^_/]+)_" }
    tag_on_failure => []
  }
  mutate { add_field => { "[@metadata][source_type]" => "json" } }
}
output { pipeline { send_to => ["normalize"] } }
