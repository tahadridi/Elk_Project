input { pipeline { address => "normalize" } }

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure"]
  }

  mutate {
    uppercase => ["level"]
    rename => {
      "level"         => "[log][level]"
      "service"       => "[service][name]"
      "event_action"  => "[event][action]"
      "event_outcome" => "[event][outcome]"
      "source_ip"     => "[source][ip]"
      "user_name"     => "[user][name]"
    }
  }

  if [@metadata][source_type] {
    mutate { add_field => { "[event][dataset]" => "%{[@metadata][source_type]}" } }
  }

  if [source][ip] {
    grok {
      match => { "[source][ip]" => "^%{IP}$" }
      tag_on_failure => ["_ipparsefailure"]
    }
    if "_ipparsefailure" not in [tags] and [source][ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.)/ {
      geoip {
        source => "[source][ip]"
        target => "[source][geo]"
        fields => ["country_name", "country_code2", "city_name", "location"]
        tag_on_failure => ["_geoip_lookup_failure"]
      }
      mutate { rename => { "[source][geo][country_code2]" => "[source][geo][country_iso_code]" } }
    }
  }

  mutate {
    remove_field => ["timestamp", "path", "host", "event_original", "@version"]
  }
}

output {
  if "_csvparsefailure" in [tags] or "_jsonparsefailure" in [tags]
     or "_dateparsefailure" in [tags] or "_ipparsefailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-parse-errors-%{+YYYY.MM}"
      manage_template => false
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-security-%{+YYYY.MM.dd}"
      manage_template => false
    }
  }
}
