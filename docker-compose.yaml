
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: sm-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
    networks: [backend]

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: sm-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
    networks: [frontend, backend]

  elastic-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: sm-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in logs-security logs-parse-errors; do
          curl -fsS -X PUT "http://elasticsearch:9200/_index_template/$$t" \
            -H 'Content-Type: application/json' \
            --data-binary @/templates/$$t-template.json
          echo
        done
        echo "Index templates installed."
    volumes:
      - ./infra/elasticsearch:/templates:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: sm-logstash
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - XPACK_MONITORING_ENABLED=false
    ports:
      - "127.0.0.1:9600:9600"
    volumes:
      - ./infra/logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./data/input:/data/input
      - logstash_data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      elastic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
    networks: [backend]

  mongodb:
    image: mongo:7
    container_name: sm-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 15s
      timeout: 10s
      retries: 6
    networks: [backend]

  redis:
    image: redis:7
    container_name: sm-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [backend]

volumes:
  es_data:
  logstash_data:
  mongo_data:
  redis_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
